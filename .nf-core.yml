repository_type: pipeline
nf_core_version: "3.3.2"

lint:
  files_exist:
    - assets/nf-core-speciesabundance_logo_light.png
    - docs/images/nf-core-speciesabundance_logo_light.png
    - docs/images/nf-core-speciesabundance_logo_dark.png
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - lib/Utils.groovy
    - lib/WorkflowMain.groovy
    - lib/NfcoreTemplate.groovy
    - lib/WorkflowSpeciesabundance.groovy
  files_unchanged:
    - assets/sendmail_template.txt
    - assets/email_template.html
    - lib/NfcoreTemplate.groovy
    - .github/CONTRIBUTING.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - assets/email_template.txt
    - docs/README.md
    - LICENSE
  pipeline_name_conventions: False
  actions_awsfulltest: False
  multiqc_config:
    - report_comment
  nextflow_config:
    - custom_config
    - manifest.name
    - manifest.homePage
    - params.max_cpus
    - params.max_memory
    - params.max_time
  readme:
    - nextflow_badge
  nf_test_content:
    - tests/main.nf.test

  template:
    org: phac-nml
    name: speciesabundance
    description: SpeciesAbundance pipeline
    outdir: .
    is_nfcore: false
